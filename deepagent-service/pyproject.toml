[project]
name = "deepagent-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.140", # [standard] 含 fastapi CLI 與 uvicorn;>=0.140 才有 fastapi.sse
    "deepagents==0.7.34", # sandbox 整合需 0.7.x(execute 輸出 offload、delete);開發與生產一律鎖同一版,不另維護 internal 變體
    "langchain>=1.4.9", # deepagents 0.7.x 下限
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "duckdb>=1.2",
    "pytz>=2024.1", # duckdb 未宣告的 optional 依賴;查詢結果含 TIMESTAMP WITH TIME ZONE 時,fetch 轉 datetime 需要它(缺則 DuckDB 拋 "Required module 'pytz' failed to import")
    "langfuse>=3.0", # tracing;未設 LANGFUSE_* env 時為 no-op
    "pydantic>=2.0",
    "pydantic-settings>=2.0", # 集中設定;env > one.properties > 預設
    "quickjs>=1.19.4",
    "boto3>=1.35,<1.36", # 釘 <1.36,避開該版起 checksum 預設變更(internal S3-compatible 儲存不認)
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "openpyxl>=3.1,<4", # 僅 source_cache xlsx 轉檔用——engine 純度:stdlib＋boto3＋openpyxl
    "httpx>=0.27", # agent/ 直發 HTTP(auth token-exchange);先前僅靠 fastapi/anthropic 等傳遞依賴帶入,未直接宣告
    "mcp>=1.24,<2", # mcp_adapter.py 直接用 mcp.types(TextContent/TextResourceContents/Tool)；[cli] extra 已不需要——client 線路全交給下方 fastmcp,不再用 mcp.server.fastmcp。>=1.24 對齊 fastmcp 3.x 的下限,<2——2.x 協定型別改版
    "fastmcp>=3,<4", # PrefectHQ 獨立套件(非官方 mcp SDK 內建的 mcp.server.fastmcp)；mcp_adapter.py 的 client 線路(stateless streamable HTTP)與 tests/test_mcp_adapter.py 的 fixture server 皆用它,取代手刻的 SDK ClientSession/streamable_http_client 協定管線
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
# internal registry 版本上限;langfuse 傳遞依賴
constraint-dependencies = [
    "opentelemetry-api==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "opentelemetry-exporter-otlp-proto-http==1.39.1",
    "opentelemetry-exporter-otlp-proto-common==1.39.1",
    "opentelemetry-proto==1.39.1",
    "wrapt==1.17.3",
    "protobuf==6.33.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langchain".msg = "engine 層禁用——engine/ 不得依賴 LLM 框架,agent/ 是唯一知道 LLM 存在的地方"
"langchain_core".msg = "engine 層禁用——engine/ 不得依賴 LLM 框架,agent/ 是唯一知道 LLM 存在的地方"
"langchain_openai".msg = "engine 層禁用——engine/ 不得依賴 LLM 框架,agent/ 是唯一知道 LLM 存在的地方"
"langgraph".msg = "engine 層禁用——engine/ 不得依賴 LLM 框架,agent/ 是唯一知道 LLM 存在的地方"
"langfuse".msg = "engine 層禁用——engine/ 不得依賴 LLM 框架,agent/ 是唯一知道 LLM 存在的地方"
"deepagents".msg = "engine 層禁用——engine/ 不得依賴 LLM 框架,agent/ 是唯一知道 LLM 存在的地方"

[tool.ruff.lint.per-file-ignores]
"app/agent/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
