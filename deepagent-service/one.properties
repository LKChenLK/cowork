# 進版控範本：deepagent-service 全部 Settings key 與預設值一覽，secrets 一律留空。
# key 清單／型別／預設值的權威來源＝ app/config.py 的 Settings（新增/改欄位時同步更新本檔）。
#
# 本機開發：複製本檔為 one-local.properties（gitignored）並填入真值——程式預設讀
# one-local.properties，不需要另外設定 ONE_PROPERTIES_PATH。
#
# internal 部署：掛載本檔名（one.properties）的實值版到容器內，並用 ONE_PROPERTIES_PATH
# 指向實際掛載路徑。
#
# 格式：Java 式 KEY=value；# 開頭與空行跳過；優先序 env > properties 檔 > 欄位預設。

# ── LLM／runtime ──────────────────────────────────────────────────────────
AGENT_RUNTIME=deepagents
AGENT_MODEL=deepseek-v4-flash
AGENT_MAX_TOKENS=32768
AGENT_REASONING_MAX_TOKENS=8192
AGENT_RECURSION_LIMIT=80
AGENT_PROVIDER_SORT=
AGENT_PROVIDER_IGNORE=
OPENAI_BASE_URL=
OPENAI_API_KEY=

# ── workspace ─────────────────────────────────────────────────────────────
AGENT_WORKSPACE_ROOT=/data/workspace
AGENT_BUILTIN_SKILLS_DIR=

# ── 儲存（S3；STORAGE_BACKEND=local 時以下 S3_* 不生效）──────────────────────
STORAGE_BACKEND=local
S3_ENDPOINT=
S3_BUCKET=erd-cowork
S3_ACCESS_KEY=
S3_SECRET_KEY=
# 共用 bucket 子路徑，須與 backend erd.storage.s3.key-prefix 同值
S3_KEY_PREFIX=

# ── Langfuse（trace 觀測；PUBLIC/SECRET 兩者皆空即 no-op）────────────────────
LANGFUSE_PUBLIC_KEY=
LANGFUSE_SECRET_KEY=
LANGFUSE_HOST=

# ── auth token-exchange（internal LLM API 認證；AGENT_AUTH_MODE=bearer 時以下不生效）──
AGENT_AUTH_MODE=bearer
AGENT_TOKEN_EXCHANGE_URL=
AGENT_TOKEN_HEADER=
AGENT_TOKEN_TTL=300
AGENT_SERVICE_ACCOUNT_KEY=
AGENT_SERVICE_ACCOUNT_KEY_FILE=

# ── guard 與 repair ───────────────────────────────────────────────────────
ERD_GUARD_BLOCKING=true
REPAIR_MODEL_CALL_TIMEOUT_SECONDS=60.0
