# 中文僅可用於註解，值一律使用 ASCII——Spring Boot 讀取 .properties 檔案以 ISO-8859-1 解碼，
# 非 ASCII 值會被錯誤解碼(註解本身在解析時整行跳過，不受影響)。

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/cowork}
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=5120MB

server.port=8080

# true=身分由 internal 側同層 filter 提供,主線 CurrentUserFilter 不註冊;預設 false 走 X-User-Id。
tsso.enabled=${TSSO_ENABLED:false}

# 儲存路線:local(磁碟)| s3(物件儲存)。s3 帳密走下方 access-key/secret-key 設定項
erd.storage.type=${ERD_STORAGE_TYPE:local}
erd.storage.local-dir=${ERD_STORAGE_LOCAL_DIR:./data/files}
erd.storage.workspace-dir=${ERD_STORAGE_WORKSPACE_DIR:./data/workspace}
erd.storage.cleanup.cron=${ERD_STORAGE_CLEANUP_CRON:0 0 3 * * *}
erd.storage.cleanup.dry-run=${ERD_STORAGE_CLEANUP_DRY_RUN:true}
erd.storage.retention.uploads=${ERD_STORAGE_RETENTION_UPLOADS:180d}
erd.storage.retention.workspace=${ERD_STORAGE_RETENTION_WORKSPACE:180d}
erd.storage.retention.artifact=${ERD_STORAGE_RETENTION_ARTIFACT:730d}
erd.storage.s3.endpoint=${ERD_STORAGE_S3_ENDPOINT:}
erd.storage.s3.bucket=${ERD_STORAGE_S3_BUCKET:erd-cowork}
erd.storage.s3.access-key=${ERD_STORAGE_S3_ACCESS_KEY:}
erd.storage.s3.secret-key=${ERD_STORAGE_S3_SECRET_KEY:}
# S3 物件 key 共同前綴(internal 共用 bucket 的子路徑)。空=落 bucket 根;設值時 deepagent S3_KEY_PREFIX MUST 同值
erd.storage.s3.key-prefix=${ERD_STORAGE_S3_KEY_PREFIX:}

erd.upload.max-files=5
erd.upload.max-session-bytes=5368709120
erd.upload.max-csv-bytes=2147483648
erd.upload.max-xlsx-bytes=209715200
# 上傳時擷取樣本列數——prompt 樣本的唯一來源
erd.upload.sample-rows=${ERD_UPLOAD_SAMPLE_ROWS:20}

erd.artifact.rewrite.current-profile=tw3-ec5
erd.artifact.rewrite.profiles.tw3-ec5[0].pattern=https://cdn\\.tailwindcss\\.com[^"']*
erd.artifact.rewrite.profiles.tw3-ec5[0].replacement=/vendor/tailwind-play-v3.js
erd.artifact.rewrite.profiles.tw3-ec5[1].pattern=https://cdn\\.jsdelivr\\.net/npm/echarts@5[^"']*
erd.artifact.rewrite.profiles.tw3-ec5[1].replacement=/vendor/echarts-v5.min.js

erd.agent.provider=${ERD_AGENT_PROVIDER:openai-compatible}
erd.agent.analysis.base-url=${ERD_AGENT_ANALYSIS_BASE_URL:http://localhost:8000}
erd.agent.analysis.source-root=${ERD_AGENT_ANALYSIS_SOURCE_ROOT:../backend/data/files}
erd.agent.analysis.request-timeout-seconds=${ERD_AGENT_ANALYSIS_REQUEST_TIMEOUT_SECONDS:180}
erd.agent.analysis.max-in-memory-size-mb=${ERD_AGENT_ANALYSIS_MAX_IN_MEMORY_SIZE_MB:64}
erd.agent.analysis.bearer-token=${ERD_AGENT_ANALYSIS_BEARER_TOKEN:}
erd.agent.open-ai-compatible.base-url=${ERD_AGENT_OPENAI_COMPATIBLE_BASE_URL:}
erd.agent.open-ai-compatible.api-key=${ERD_AGENT_OPENAI_COMPATIBLE_API_KEY:}
erd.agent.open-ai-compatible.model=${ERD_AGENT_OPENAI_COMPATIBLE_MODEL:deepseek-v4-flash}
erd.agent.open-ai-compatible.context-window=${ERD_AGENT_OPENAI_COMPATIBLE_CONTEXT_WINDOW:131072}
erd.agent.open-ai-compatible.chat-completions-path=${ERD_AGENT_OPENAI_COMPATIBLE_CHAT_PATH:/v1/chat/completions}
erd.agent.open-ai-compatible.auth-mode=${ERD_AGENT_OPENAI_COMPATIBLE_AUTH_MODE:bearer}
erd.agent.open-ai-compatible.token-exchange.url=${ERD_AGENT_OPENAI_COMPATIBLE_TOKEN_EXCHANGE_URL:}
erd.agent.open-ai-compatible.token-exchange.service-account-key=${ERD_AGENT_OPENAI_COMPATIBLE_SERVICE_ACCOUNT_KEY:}
erd.agent.open-ai-compatible.token-exchange.service-account-key-file=${ERD_AGENT_OPENAI_COMPATIBLE_SERVICE_ACCOUNT_KEY_FILE:}
erd.agent.open-ai-compatible.token-exchange.header-name=${ERD_AGENT_OPENAI_COMPATIBLE_TOKEN_HEADER:}
erd.agent.open-ai-compatible.token-exchange.token-ttl-seconds=${ERD_AGENT_OPENAI_COMPATIBLE_TOKEN_TTL:300}
erd.agent.repair.enabled=${ERD_AGENT_REPAIR_ENABLED:true}
